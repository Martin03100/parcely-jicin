name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: find src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t parcely-jicin .
