services:
  - type: web
    name: parcely-jicin
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/meta
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parcely-db
          property: connectionString
      - key: DATA_URL
        value: https://github.com/Martin03100/parcely-jicin/releases/download/data-2026-10-02/parcels-cuzk.tsv.gz
      - key: DB_AUTO_INIT
        value: "1"
      - key: PARCEL_MIN_ZOOM
        value: "14"

databases:
  - name: parcely-db
    databaseName: parcely
    user: parcely
    plan: free
    region: frankfurt
