<VirtualHost *:${PORT}>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Require all granted
        DirectoryIndex index.php
        # Everything that is not a file goes to the front controller.
        FallbackResource /index.php
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org; worker-src blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>
</VirtualHost>
